<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شبكة زملاء وزميلات — زمالة المشاركة المجتمعية</title>
<meta name="description" content="حمّل جهات اتصال زملاء وزميلات زمالة المشاركة المجتمعية مباشرة على هاتفك">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="page">

  <header class="logos-bar" aria-label="شعارات زمالة المشاركة المجتمعية">
    <img src="assets/logos/logo-1-saudi-fellowship.png" alt="الزمالة السعودية للمشاركة المجتمعية" class="logo logo-main">
    <div class="logos-sub">
      <img src="assets/logos/logo-2-professional-fellowships.png" alt="الزمالات المهنية">
      <img src="assets/logos/logo-3-kau-endowment.png" alt="الوقف العلمي - جامعة الملك عبدالعزيز">
      <img src="assets/logos/logo-4-cie.png" alt="مركز الابتكار وريادة الأعمال">
    </div>
  </header>

  <main>
    <section class="hero">
      <p class="kicker">شبكة الزمالة</p>
      <h1 class="title">
        <span>شبكة زملاء وزميلات</span>
        <span class="gold">زمالة المشاركة المجتمعية</span>
      </h1>
      <span class="badge">٥٠ جهة اتصال</span>
      <p class="subtitle">اختر الاسم ثم اضغط «إضافة» لحفظ جهة الاتصال في هاتفك.</p>
    </section>

    <section class="contacts">
      <div class="contact-search">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="m20 20-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input type="search" id="contactSearch" placeholder="ابحث باسم الزميل أو الزميلة" aria-label="ابحث باسم الزميل أو الزميلة" autocomplete="off">
      </div>

      <ul class="contact-table" id="contactList" role="list" aria-live="polite"></ul>
      <p class="contact-empty" id="contactEmpty" hidden>لا توجد نتائج مطابقة.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>زمالة المشاركة المجتمعية &middot; الإصدار ١٤٤٧هـ – ٢٠٢٥/٢٠٢٦م</p>
  </footer>

</div>

<script src="assets/contacts-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
